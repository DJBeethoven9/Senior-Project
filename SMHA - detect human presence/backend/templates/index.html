<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>SMHA — Presence Radar</title>
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #080c12;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: #0d1117;
      border-bottom: 1px solid #1c2333;
      flex-shrink: 0;
      gap: 16px;
    }
    .logo {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #58a6ff;
    }
    .logo sub {
      font-size: 10px;
      font-weight: 400;
      color: #6e7681;
      letter-spacing: 0.04em;
      vertical-align: baseline;
      margin-left: 6px;
    }

    #status-pill {
      padding: 7px 22px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      transition: background .35s, color .35s, border-color .35s, box-shadow .35s;
      white-space: nowrap;
    }
    .s-presence    { background:#2d0c0c; color:#ff7b72; border:1px solid #9e2a2a; box-shadow:0 0 14px rgba(200,50,50,.35); }
    .s-no-presence { background:#0c2416; color:#3fb950; border:1px solid #246130; box-shadow:0 0 10px rgba(40,180,80,.2); }
    .s-calibrating { background:#131a27; color:#79c0ff; border:1px solid #1f4e79; }
    .s-waiting     { background:#131a27; color:#6e7681; border:1px solid #1c2333; }

    #conf-header {
      font-size: 12px;
      color: #6e7681;
      white-space: nowrap;
      font-family: ui-monospace, Consolas, monospace;
    }
    #conf-header span { color: #e6edf3; }

    /* ── main split ── */
    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── room canvas ── */
    #room-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      min-width: 0;
    }
    #room-canvas {
      border-radius: 10px;
      display: block;
    }

    /* ── right sidebar ── */
    #sidebar {
      width: 270px;
      flex-shrink: 0;
      background: #0d1117;
      border-left: 1px solid #1c2333;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sb-section {
      padding: 14px 14px 10px;
      border-bottom: 1px solid #1c2333;
    }
    .sb-section h3 {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #484f58;
      margin-bottom: 10px;
    }

    /* board cards */
    .board-card {
      background: #080c12;
      border: 1px solid #1c2333;
      border-radius: 8px;
      padding: 10px 11px;
      margin-bottom: 9px;
    }
    .board-card.active { border-color: #1f3a6e; }
    .board-card.pres   { border-color: #6e1f1f; }

    .bc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
    }
    .bc-name { font-size: 12px; font-weight: 700; font-family: ui-monospace, Consolas, monospace; }
    .bc-badge {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1c2333;
      color: #6e7681;
    }
    .bc-badge.on   { background:#0c2416; color:#3fb950; }
    .bc-badge.pres { background:#2d0c0c; color:#ff7b72; }

    .conf-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 6px;
    }
    .conf-track {
      flex: 1;
      height: 5px;
      background: #1c2333;
      border-radius: 3px;
      overflow: hidden;
    }
    .conf-fill {
      height: 100%;
      border-radius: 3px;
      background: #1f6feb;
      transition: width .4s ease, background .4s;
    }
    .conf-fill.med  { background: #d29922; }
    .conf-fill.high { background: #cf222e; }
    .conf-pct {
      font-size: 11px;
      font-family: ui-monospace, Consolas, monospace;
      color: #6e7681;
      width: 38px;
      text-align: right;
    }

    .bc-metrics {
      display: grid;
      grid-template-columns: auto 1fr auto 1fr;
      gap: 2px 6px;
      font-size: 10px;
      font-family: ui-monospace, Consolas, monospace;
      color: #484f58;
      margin-bottom: 7px;
    }
    .bc-metrics .v { color: #8b949e; }

    .mini-label { font-size: 9px; color: #484f58; margin-bottom: 3px; letter-spacing: 0.06em; }
    canvas.mini-hm {
      width: 100%;
      height: 44px;
      border-radius: 4px;
      image-rendering: pixelated;
      background: #080c12;
    }

    /* system meta */
    .meta-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 3px 10px;
      font-size: 10px;
      font-family: ui-monospace, Consolas, monospace;
      color: #484f58;
    }
    .meta-grid .v { color: #8b949e; }

    /* ── footer ── */
    footer {
      flex-shrink: 0;
      background: #0d1117;
      border-top: 1px solid #1c2333;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    button {
      padding: 5px 13px;
      border-radius: 6px;
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #30363d; }
    .footer-hint { font-size: 10px; color: #484f58; }
  </style>
</head>
<body>

<header>
  <div class="logo">SMHA<sub>Wi-Fi CSI Presence Radar</sub></div>
  <div id="status-pill" class="s-waiting">◌ WAITING…</div>
  <div id="conf-header">confidence <span id="conf-val">—</span></div>
</header>

<main>
  <div id="room-wrap">
    <canvas id="room-canvas"></canvas>
  </div>

  <div id="sidebar">
    <div class="sb-section">
      <h3>Sensor Boards</h3>
      <div id="board-cards"></div>
    </div>
    <div class="sb-section">
      <h3>System</h3>
      <div class="meta-grid" id="sys-meta"></div>
    </div>
  </div>
</main>

<footer>
  <button onclick="doRecalibrate()">↺ Recalibrate</button>
  <button onclick="doResetPos()">⤢ Reset positions</button>
  <span class="footer-hint">Drag sensor nodes to match their physical positions in the room.</span>
</footer>

<script>
/* ═══════════════════════════════════════════════════════════════
   BOARD POSITIONS — fractional (0–1) of canvas width/height
   Persisted in localStorage so the user's layout survives refresh.
═══════════════════════════════════════════════════════════════ */
const DEFAULT_POS = {
  COM7: { x: 0.18, y: 0.20 },
  COM5: { x: 0.80, y: 0.74 },
  COM6: { x: 0.50, y: 0.48 },
};
let boardPos = JSON.parse(localStorage.getItem('smha-pos') || 'null') || structuredClone(DEFAULT_POS);
function savePOS() { localStorage.setItem('smha-pos', JSON.stringify(boardPos)); }
function doResetPos() { boardPos = structuredClone(DEFAULT_POS); savePOS(); }
function getPos(port) { return boardPos[port] ?? { x: 0.5, y: 0.5 }; }

/* ═══════════════════════════════════════════════════════════════
   CANVAS
═══════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('room-canvas');
const ctx    = canvas.getContext('2d');
let CW = 0, CH = 0;

function resize() {
  const wrap = document.getElementById('room-wrap');
  const maxW = wrap.clientWidth  - 36;
  const maxH = wrap.clientHeight - 36;
  const ar   = 4 / 3;
  if (maxW / maxH > ar) { CH = maxH; CW = Math.round(CH * ar); }
  else                  { CW = maxW; CH = Math.round(CW / ar); }
  canvas.width  = CW; canvas.height = CH;
  canvas.style.width  = CW + 'px';
  canvas.style.height = CH + 'px';
}
window.addEventListener('resize', resize);
resize();

/* ═══════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════ */
let lastStatus  = {};
let lastHeatmap = {};
let animT       = 0;   // 0–1 looping at ~60 fps

/* ═══════════════════════════════════════════════════════════════
   COLOR HELPERS
═══════════════════════════════════════════════════════════════ */
const BOARD_HEX = { COM7: '#58a6ff', COM5: '#f78166', COM6: '#3fb950' };
function bColor(port) { return BOARD_HEX[port] ?? '#8b949e'; }

function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
function rgba(hex, a) {
  const [r,g,b] = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a.toFixed(3)})`;
}

/* cold-dark-blue → teal → amber → red heat ramp */
const HEAT_STOPS = [
  [8,  14, 28],
  [10, 55, 80],
  [15,110, 70],
  [190,145, 20],
  [195, 45, 25],
  [160, 15, 10],
];
function heatRGBA(t, a) {
  t = Math.max(0, Math.min(1, t));
  const x = t * (HEAT_STOPS.length - 1);
  const i = Math.min(HEAT_STOPS.length - 2, Math.floor(x));
  const f = x - i;
  return HEAT_STOPS[i].map((c, k) => Math.round(c + (HEAT_STOPS[i+1][k] - c) * f)).concat([Math.round(a*255)]);
}

/* sidebar mini-heatmap uses classic 5-stop ramp */
const MINI_STOPS = [[13,17,23],[28,68,113],[26,132,105],[232,196,106],[189,54,47]];
function miniRamp(v) {
  v = Math.max(0, Math.min(1, Number(v)||0));
  const x = v*(MINI_STOPS.length-1), i = Math.min(MINI_STOPS.length-2, Math.floor(x)), f=x-i;
  return MINI_STOPS[i].map((c,k) => Math.round(c+(MINI_STOPS[i+1][k]-c)*f));
}

/* ═══════════════════════════════════════════════════════════════
   OFFSCREEN HEAT GRID
   We build a small float grid (80×60) and accumulate each board's
   radial CSI-weighted contribution, then blit it with smoothing.
═══════════════════════════════════════════════════════════════ */
const GW = 80, GH = 60;
const heatBuf = new Float32Array(GW * GH);
const tmpCanvas = document.createElement('canvas');
tmpCanvas.width = GW; tmpCanvas.height = GH;
const tmpCtx = tmpCanvas.getContext('2d');

function buildHeatGrid(boards) {
  heatBuf.fill(0);
  for (const b of boards) {
    if (!b.active) continue;
    const conf = Math.max(0, (b.confidence || 0) / 100);
    if (conf < 0.04) continue;

    /* per-subcarrier delta energy from /heatmap — last 4 rows averaged */
    const hmb = (lastHeatmap.boards || []).find(h => h.port === b.port);
    let csiEnergy = null;
    if (hmb?.amplitude_delta?.values?.length) {
      const vals = hmb.amplitude_delta.values;
      const nRows = Math.min(4, vals.length);
      const nCols = vals[0].length;
      csiEnergy = new Float32Array(nCols);
      for (let r = vals.length - nRows; r < vals.length; r++)
        for (let c = 0; c < nCols; c++) csiEnergy[c] += vals[r][c] / nRows;
      const mx = Math.max(...csiEnergy) || 1;
      for (let c = 0; c < nCols; c++) csiEnergy[c] /= mx;
    }

    const pos = getPos(b.port);
    const bx = pos.x * GW, by = pos.y * GH;
    const R  = 0.42 * GW;   /* influence radius in grid units */

    for (let gy = 0; gy < GH; gy++) {
      for (let gx = 0; gx < GW; gx++) {
        const dist = Math.hypot(gx - bx, gy - by);
        if (dist > R) continue;
        const radW = (1 - dist / R) ** 2;

        /* map gx → subcarrier index to modulate with real CSI texture */
        let csiW = 1.0;
        if (csiEnergy) {
          const ci = Math.round((gx / GW) * (csiEnergy.length - 1));
          csiW = 0.25 + 0.75 * csiEnergy[Math.max(0, Math.min(csiEnergy.length-1, ci))];
        }
        heatBuf[gy * GW + gx] += conf * radW * csiW;
      }
    }
  }

  /* normalise */
  let maxV = 0;
  for (let i = 0; i < heatBuf.length; i++) if (heatBuf[i] > maxV) maxV = heatBuf[i];
  return maxV;
}

function drawHeatOverlay(boards) {
  const maxV = buildHeatGrid(boards);
  if (maxV < 0.01) return;

  const img = tmpCtx.createImageData(GW, GH);
  for (let i = 0; i < GW * GH; i++) {
    const t = heatBuf[i] / maxV;
    const [r,g,b,a] = heatRGBA(t, Math.min(0.92, t * 1.4));
    img.data[i*4]   = r;
    img.data[i*4+1] = g;
    img.data[i*4+2] = b;
    img.data[i*4+3] = a;
  }
  tmpCtx.putImageData(img, 0, 0);

  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.globalCompositeOperation = 'screen';
  ctx.drawImage(tmpCanvas, 8, 8, CW-16, CH-16);
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════
   RADAR RINGS — expand outward, fade, speed ∝ confidence
═══════════════════════════════════════════════════════════════ */
function drawRadarRings(boards) {
  for (const b of boards) {
    if (!b.active) continue;
    const conf = Math.max(0, (b.confidence || 0) / 100);
    if (conf < 0.05) continue;
    const pos  = getPos(b.port);
    const cx   = pos.x * CW, cy = pos.y * CH;
    const hex  = bColor(b.port);
    const maxR = Math.min(CW, CH) * 0.34 * Math.max(0.3, conf);
    const NUM  = 3;
    for (let k = 0; k < NUM; k++) {
      const phase  = ((animT * 0.7) + k / NUM) % 1;
      const radius = phase * maxR;
      const alpha  = (1 - phase) * 0.45 * conf;
      if (alpha < 0.01) continue;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(hex, alpha);
      ctx.lineWidth   = 1.5;
      ctx.stroke();
    }
  }
}

/* ═══════════════════════════════════════════════════════════════
   PERSON BLOB — confidence-weighted centroid of active boards
═══════════════════════════════════════════════════════════════ */
function drawPersonBlob(boards) {
  if ((lastStatus.status || '') !== 'PRESENCE') return;
  let wx = 0, wy = 0, wt = 0;
  for (const b of boards) {
    if (!b.active) continue;
    const conf = Math.max(0, (b.confidence || 0) / 100);
    if (conf < 0.05) continue;
    const p = getPos(b.port);
    wx += p.x * conf; wy += p.y * conf; wt += conf;
  }
  if (wt < 0.01) return;
  const cx   = (wx / wt) * CW;
  const cy   = (wy / wt) * CH;
  const gConf = Math.max(0, (lastStatus.confidence || 0) / 100);
  const pulse  = 0.78 + 0.22 * Math.sin(animT * Math.PI * 2 * 2.5);

  /* outer glow */
  const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, 72 * pulse);
  gr.addColorStop(0,   `rgba(255, 90, 90, ${0.55 * gConf})`);
  gr.addColorStop(0.35,`rgba(220, 55, 55, ${0.25 * gConf})`);
  gr.addColorStop(1,   'rgba(180, 30, 30, 0)');
  ctx.beginPath();
  ctx.arc(cx, cy, 72 * pulse, 0, Math.PI * 2);
  ctx.fillStyle = gr;
  ctx.fill();

  /* inner core */
  ctx.beginPath();
  ctx.arc(cx, cy, 11 * pulse, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255, 190, 190, ${0.95 * gConf})`;
  ctx.fill();

  /* stick figure */
  const sc = pulse * Math.min(1, gConf + 0.5);
  ctx.save();
  ctx.translate(cx, cy - 30 * sc);
  ctx.strokeStyle = `rgba(255, 230, 230, ${0.9 * gConf})`;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, 6*sc, 0, Math.PI*2); ctx.stroke();          // head
  ctx.beginPath(); ctx.moveTo(0,6*sc); ctx.lineTo(0,19*sc); ctx.stroke();    // body
  ctx.beginPath(); ctx.moveTo(-8*sc,11*sc); ctx.lineTo(8*sc,11*sc); ctx.stroke(); // arms
  ctx.beginPath(); ctx.moveTo(0,19*sc); ctx.lineTo(-7*sc,30*sc); ctx.stroke();// left leg
  ctx.beginPath(); ctx.moveTo(0,19*sc); ctx.lineTo(7*sc,30*sc); ctx.stroke(); // right leg
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════
   BOARD NODES — draggable circles with confidence arc
═══════════════════════════════════════════════════════════════ */
function drawBoardNodes(boards) {
  for (const b of boards) {
    const pos  = getPos(b.port);
    const cx   = pos.x * CW, cy = pos.y * CH;
    const hex  = bColor(b.port);
    const conf = Math.max(0, (b.confidence || 0) / 100);
    const live = b.active;
    const pres = b.status === 'PRESENCE';

    /* shadow glow when active */
    if (live) {
      ctx.save();
      ctx.shadowColor = pres ? '#ff4444' : hex;
      ctx.shadowBlur  = pres ? 18 : 10;
      ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI*2);
      ctx.fillStyle = 'transparent'; ctx.fill();
      ctx.restore();
    }

    /* outer circle */
    ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI*2);
    ctx.fillStyle   = live ? rgba(hex, 0.12) : rgba('#8b949e', 0.06);
    ctx.fill();
    ctx.strokeStyle = live ? rgba(hex, 0.55) : '#1c2333';
    ctx.lineWidth   = 1.5;
    ctx.stroke();

    /* confidence arc (clockwise from top) */
    if (live && conf > 0.01) {
      ctx.beginPath();
      ctx.arc(cx, cy, 17, -Math.PI/2, -Math.PI/2 + conf * Math.PI * 2);
      ctx.strokeStyle = pres ? rgba('#ff7b72', 0.85) : rgba(hex, 0.85);
      ctx.lineWidth   = 3;
      ctx.stroke();
    }

    /* center dot */
    ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, Math.PI*2);
    ctx.fillStyle = live ? hex : '#2d333b';
    ctx.fill();

    /* label */
    ctx.font      = 'bold 10px ui-monospace, Consolas, monospace';
    ctx.fillStyle = live ? hex : '#484f58';
    ctx.textAlign = 'center';
    ctx.fillText(b.port, cx, cy + 29);

    /* conf % under label */
    if (live) {
      ctx.font      = '9px ui-monospace, Consolas, monospace';
      ctx.fillStyle = pres ? '#ff7b72' : rgba(hex, 0.7);
      ctx.fillText((conf*100).toFixed(0) + '%', cx, cy + 40);
    }
  }
  ctx.textAlign = 'left';
}

/* ═══════════════════════════════════════════════════════════════
   ROOM BACKGROUND
═══════════════════════════════════════════════════════════════ */
function drawRoom() {
  /* floor fill */
  ctx.fillStyle = '#080c12';
  ctx.fillRect(0, 0, CW, CH);

  /* subtle grid */
  ctx.strokeStyle = 'rgba(28,35,51,0.6)';
  ctx.lineWidth   = 0.5;
  const sp = 36;
  for (let x = sp; x < CW; x += sp) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CH); ctx.stroke(); }
  for (let y = sp; y < CH; y += sp) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CW,y); ctx.stroke(); }

  /* wall outline */
  ctx.strokeStyle = '#1c2333';
  ctx.lineWidth   = 2;
  ctx.strokeRect(4, 4, CW-8, CH-8);

  /* corner indicators */
  const L = 16;
  ctx.strokeStyle = '#2d4a7a';
  ctx.lineWidth   = 2;
  [[6,6],[CW-6,6],[6,CH-6],[CW-6,CH-6]].forEach(([x,y]) => {
    const sx = x < CW/2 ? 1 : -1, sy = y < CH/2 ? 1 : -1;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+sx*L,y); ctx.moveTo(x,y); ctx.lineTo(x,y+sy*L); ctx.stroke();
  });
}

/* ═══════════════════════════════════════════════════════════════
   ANIMATION LOOP
═══════════════════════════════════════════════════════════════ */
function frame() {
  animT = (animT + 0.007) % 1;
  const boards = lastStatus.boards || [];
  drawRoom();
  drawHeatOverlay(boards);
  drawRadarRings(boards);
  drawPersonBlob(boards);
  drawBoardNodes(boards);
  requestAnimationFrame(frame);
}
frame();

/* ═══════════════════════════════════════════════════════════════
   DRAG BOARD NODES
═══════════════════════════════════════════════════════════════ */
let dragPort = null;

canvas.addEventListener('mousedown', e => {
  const {mx, my} = canvasMouse(e);
  for (const port of Object.keys(boardPos)) {
    const p = getPos(port);
    if (Math.hypot(mx - p.x*CW, my - p.y*CH) < 20) { dragPort = port; break; }
  }
});
canvas.addEventListener('mousemove', e => {
  const {mx, my} = canvasMouse(e);
  if (dragPort) {
    boardPos[dragPort] = { x: clamp(mx/CW,.04,.96), y: clamp(my/CH,.04,.96) };
    canvas.style.cursor = 'grabbing';
    return;
  }
  const near = Object.keys(boardPos).some(port => {
    const p = getPos(port);
    return Math.hypot(mx - p.x*CW, my - p.y*CH) < 20;
  });
  canvas.style.cursor = near ? 'grab' : 'default';
});
canvas.addEventListener('mouseup', () => { if (dragPort) { savePOS(); dragPort = null; } });
canvas.addEventListener('mouseleave', () => { if (dragPort) { savePOS(); dragPort = null; } });

function canvasMouse(e) {
  const r = canvas.getBoundingClientRect();
  return { mx: e.clientX - r.left, my: e.clientY - r.top };
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

/* ═══════════════════════════════════════════════════════════════
   SIDEBAR — board cards
═══════════════════════════════════════════════════════════════ */
function fmt(v, d=2) { return (v===null||v===undefined) ? '—' : Number(v).toFixed(d); }

function updateSidebar(s) {
  const boards = s.boards || [];
  const wrap   = document.getElementById('board-cards');

  for (const b of boards) {
    /* ensure card exists */
    if (!document.getElementById('bc-' + b.port)) {
      const card = document.createElement('div');
      card.id = 'bc-' + b.port;
      card.className = 'board-card';
      const hex = bColor(b.port);
      card.innerHTML = `
        <div class="bc-header">
          <span class="bc-name" style="color:${hex}">${b.port}</span>
          <span class="bc-badge" id="badge-${b.port}">OFFLINE</span>
        </div>
        <div class="conf-row">
          <div class="conf-track"><div class="conf-fill" id="cf-${b.port}" style="width:0%"></div></div>
          <div class="conf-pct" id="cp-${b.port}">0.0%</div>
        </div>
        <div class="bc-metrics" id="bm-${b.port}"></div>
        <div class="mini-label">CSI amplitude delta</div>
        <canvas class="mini-hm" id="mhm-${b.port}"></canvas>
      `;
      wrap.appendChild(card);
    }

    const conf = b.confidence || 0;
    const card = document.getElementById('bc-' + b.port);
    card.className = 'board-card' + (b.status==='PRESENCE' ? ' pres' : b.active ? ' active' : '');

    const badge = document.getElementById('badge-' + b.port);
    badge.textContent  = b.status === 'PRESENCE' ? 'PRESENCE' : b.active ? 'ACTIVE' : 'OFFLINE';
    badge.className    = 'bc-badge' + (b.status==='PRESENCE' ? ' pres' : b.active ? ' on' : '');

    const fill = document.getElementById('cf-' + b.port);
    fill.style.width = conf + '%';
    fill.className   = 'conf-fill' + (conf>=70?' high':conf>=40?' med':'');

    document.getElementById('cp-' + b.port).textContent = conf.toFixed(1) + '%';

    document.getElementById('bm-' + b.port).innerHTML =
      `<span>motion</span><span class="v">${fmt(b.motion_ratio)}</span>` +
      `<span>shift</span><span class="v">${fmt(b.shift_score)}</span>` +
      `<span>hits</span><span class="v">${b.enter_hits??0}/${b.enter_hits_required??4}</span>` +
      `<span>rssi</span><span class="v">${b.last_rssi??'—'}</span>`;
  }

  /* register positions for any newly seen board */
  for (const b of boards)
    if (!boardPos[b.port]) boardPos[b.port] = DEFAULT_POS[b.port] ?? {x:.5,y:.5};
}

function updateSysMeta(s) {
  document.getElementById('sys-meta').innerHTML =
    `<span>frames</span><span class="v">${s.frames_seen??0}</span>` +
    `<span>errors</span><span class="v">${s.parse_errors??0}</span>` +
    `<span>buffer</span><span class="v">${s.buffer_size??0}</span>` +
    `<span>pkt age</span><span class="v">${fmt(s.last_packet_age_s,2)}s</span>` +
    `<span>motion thr</span><span class="v">${fmt(s.motion_threshold,2)}</span>` +
    `<span>shift thr</span><span class="v">${fmt(s.shift_threshold,2)}</span>` +
    `<span>auto-tune</span><span class="v">${s.auto_tuned?'on':'off'}</span>` +
    `<span>hold rem</span><span class="v">${fmt(s.hold_remaining_s,1)}s</span>`;
}

/* ═══════════════════════════════════════════════════════════════
   SIDEBAR — mini heatmaps
═══════════════════════════════════════════════════════════════ */
function drawMiniHeatmap(canvasEl, values) {
  if (!values?.length || !values[0]?.length) return;
  const rows = values.length, cols = values[0].length;
  canvasEl.width = cols; canvasEl.height = rows;
  const c2   = canvasEl.getContext('2d');
  const img  = c2.createImageData(cols, rows);
  for (let y = 0; y < rows; y++)
    for (let x = 0; x < cols; x++) {
      const [r,g,b] = miniRamp(values[y][x]);
      const idx = (y*cols+x)*4;
      img.data[idx]=r; img.data[idx+1]=g; img.data[idx+2]=b; img.data[idx+3]=255;
    }
  c2.putImageData(img, 0, 0);
}

/* ═══════════════════════════════════════════════════════════════
   STATUS PILL
═══════════════════════════════════════════════════════════════ */
function updatePill(s) {
  const pill = document.getElementById('status-pill');
  const cval = document.getElementById('conf-val');
  cval.textContent = (s.confidence??0).toFixed(1) + '%';

  if      (s.status === 'PRESENCE')    { pill.textContent='● PRESENCE DETECTED'; pill.className='s-presence'; }
  else if (s.status === 'NO_PRESENCE') { pill.textContent='○ NO PRESENCE';       pill.className='s-no-presence'; }
  else if (s.status === 'CALIBRATING') { pill.textContent=`◌ CALIBRATING ${((s.progress||0)*100).toFixed(0)}%`; pill.className='s-calibrating'; }
  else                                  { pill.textContent='◌ WAITING…';          pill.className='s-waiting'; }
}

/* ═══════════════════════════════════════════════════════════════
   POLLING
═══════════════════════════════════════════════════════════════ */
async function pollStatus() {
  try {
    const r = await fetch('/status');
    lastStatus = await r.json();
    updatePill(lastStatus);
    updateSidebar(lastStatus);
    updateSysMeta(lastStatus);
  } catch {
    document.getElementById('status-pill').textContent = '✕ BACKEND OFFLINE';
    document.getElementById('status-pill').className   = 's-waiting';
  }
}

async function pollHeatmap() {
  try {
    const r   = await fetch('/heatmap');
    lastHeatmap = await r.json();
    for (const b of lastHeatmap.boards || []) {
      const el = document.getElementById('mhm-' + b.port);
      if (el && b.amplitude_delta) drawMiniHeatmap(el, b.amplitude_delta.values);
    }
  } catch {}
}

async function doRecalibrate() {
  await fetch('/reset', { method: 'POST' });
  pollStatus();
}

setInterval(pollStatus,  400);  pollStatus();
setInterval(pollHeatmap, 900);  pollHeatmap();
</script>
